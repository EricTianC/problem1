name: Verify and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          mk_all-check: true
          axiom-audit: true
          use-github-cache: false

  package-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Attach verified revision
        run: |
          node > site/deployment.json <<'JS'
          const { GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_RUN_ID } = process.env;
          process.stdout.write(JSON.stringify({
            repo: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}`,
            sha: GITHUB_SHA,
            runId: GITHUB_RUN_ID,
          }));
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: package-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deploy
